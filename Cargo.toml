[package]
name = "fishtank"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# PANIC PREVENTION
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
# SILENT FAILURES
allow_attributes_without_reason = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
# ASYNC HAZARDS
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
